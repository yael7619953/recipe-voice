<div class="overlay" (click)="cancel.emit()">
  <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header class="dialog__head">
      <h2 class="dialog__title">
        {{ (editing ? 'categories.form.editTitle' : 'categories.form.createTitle') | translate }}
      </h2>
      <button type="button" class="dialog__close" (click)="cancel.emit()" aria-label="close">
        ✕
      </button>
    </header>

    <form class="dialog__body" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">{{ 'categories.form.name' | translate }}</span>
        <input
          type="text"
          formControlName="name"
          class="field__input"
          [placeholder]="'categories.form.namePlaceholder' | translate"
        />
      </label>

      <div class="field">
        <span class="field__label">{{ 'categories.form.icon' | translate }}</span>
        <div class="emoji-trigger-wrap">
          <button type="button" class="emoji-trigger" (click)="toggleEmojiPicker($event)">
            {{ form.controls.icon.value }}
          </button>
          @if (showEmojiPicker) {
            <div class="emoji-picker-popover" dir="ltr" (click)="$event.stopPropagation()">
              <emoji-picker
                #emojiPicker
                class="emoji-picker light"
                [attr.locale]="pickerLocale"
                [attr.data-source]="pickerDataSource"
                (emoji-click)="onEmojiSelect($event)"
              ></emoji-picker>
            </div>
          }
        </div>
      </div>

      <div class="field">
        <span class="field__label">{{ 'categories.form.color' | translate }}</span>
        <label class="color-trigger-wrap">
          <span class="color-trigger" [style.background]="form.controls.color.value"></span>
          <input type="color" class="color-native-hidden" formControlName="color" />
        </label>
      </div>

      <label class="field">
        <span class="field__label">{{ 'categories.form.parent' | translate }}</span>
        <select formControlName="parentCategory" class="field__input">
          <option [ngValue]="null">{{ 'categories.form.noParent' | translate }}</option>
          @for (opt of parentOptions; track opt.id) {
            <option [ngValue]="opt.id" [disabled]="opt.disabled">{{ opt.label }}</option>
          }
        </select>
      </label>

      <footer class="dialog__foot">
        <button type="button" class="btn btn--ghost" (click)="cancel.emit()">
          {{ 'categories.form.cancel' | translate }}
        </button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ 'categories.form.save' | translate }}
        </button>
      </footer>
    </form>
  </div>
</div>
